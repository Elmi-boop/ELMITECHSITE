# Set repo to the actual GitHub username/repository before enabling the CMS.
# This editor needs a secure authentication provider. See PUBLISHING.md.
backend:
  name: github
  repo: REPLACE_WITH_GITHUB_USERNAME/elmitech-site
  branch: main
  base_url: REPLACE_WITH_OAUTH_WORKER_HOSTNAME
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple
locale: "en"

collections:
  - name: "products"
    label: "Laptops & Equipment"
    label_singular: "Product"
    folder: "content/products"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{title}} — {{priceLabel}}"
    fields:
      - { label: "Product name", name: "title", widget: "string" }
      - { label: "URL slug", name: "slug", widget: "string" }
      - { label: "Featured on home page", name: "featured", widget: "boolean", default: false }
      - { label: "Brand", name: "brand", widget: "string" }
      - { label: "Category", name: "category", widget: "string", default: "Laptop" }
      - { label: "Condition", name: "condition", widget: "string", required: false, hint: "Enter the confirmed condition, e.g. Used or New." }
      - { label: "Price", name: "price", widget: "string", required: false }
      - { label: "Price note", name: "priceLabel", widget: "string", default: "Ask us for today’s price" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Photos"
        name: "images"
        widget: "list"
        field: { label: "Photo", name: "photo", widget: "image" }
      - label: "Specifications"
        name: "specifications"
        widget: "object"
        fields:
          - { label: "Processor", name: "processor", widget: "string" }
          - { label: "Memory", name: "memory", widget: "string" }
          - { label: "Storage", name: "storage", widget: "string" }
          - { label: "Display", name: "display", widget: "string" }
          - { label: "Graphics", name: "graphics", widget: "string", required: false }
          - { label: "Weight", name: "weight", widget: "string", required: false }
          - { label: "Battery", name: "battery", widget: "string", required: false }
          - { label: "Ports", name: "ports", widget: "text", required: false }
      - { label: "Availability", name: "status", widget: "select", options: ["available", "sold", "coming soon"], default: "available" }

  - name: "articles"
    label: "Articles & Tips"
    folder: "content/articles"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: "category", widget: "select", options: ["Laptops", "Video editing", "AI", "Apps", "Tech tips"] }
      - { label: "Short summary", name: "summary", widget: "text" }
      - { label: "Cover photo", name: "coverImage", widget: "image", required: false }
      - { label: "Published", name: "published", widget: "boolean", default: false }
      - { label: "Article", name: "body", widget: "markdown" }

  - name: "videos"
    label: "Videos & Social Posts"
    folder: "content/videos"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{title}} — {{platform}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Platform", name: "platform", widget: "select", options: ["YouTube", "Instagram", "TikTok"] }
      - { label: "Video or post URL", name: "url", widget: "string" }
      - { label: "Topic", name: "topic", widget: "string" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Published", name: "published", widget: "boolean", default: false }
